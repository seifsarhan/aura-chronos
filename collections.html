<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections | AURA CHRONOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div id="siteNav"></div>

    <section class="page-top">
        <div class="section-header reveal">
            <span class="section-kicker">Complete Catalog</span>
            <h1 class="serif">The Masterpieces</h1>
            <p>Explore twelve authenticated timepieces spanning our Geneva manufacture and rare collector vault.</p>
        </div>

        <!-- FILTER TOOLBAR -->
        <div class="filter-toolbar reveal">
            <div class="filter-top-row">
                <div class="search-input-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="catalogSearch" placeholder="Search watch name, brand, titanium, gold, reference...">
                </div>
                <select id="brandFilter" class="filter-select" aria-label="Filter by Brand">
                    <option value="ALL">All Maisons / Brands</option>
                </select>
                <select id="sortFilter" class="filter-select" aria-label="Sort Timepieces">
                    <option value="featured">Sort: Featured</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="name-asc">Name: A – Z</option>
                </select>
            </div>
            <div class="filter-pills" id="categoryPills"></div>
        </div>

        <div class="results-meta">
            <span id="resultsCount">Showing 12 timepieces</span>
            <button class="filter-pill" id="resetFiltersBtn" style="display:none;" onclick="resetCatalogFilters()">
                <i class="fas fa-undo"></i> Reset Filters
            </button>
        </div>

        <div class="grid" id="productGrid"></div>
    </section>

    <div id="siteFooter"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        let activeCategory = 'All';
        let showSavedOnly = false;

        const categories = ['All', 'Atelier', 'Dress', 'Chronograph', 'Diver', 'Aviation', 'Iconic', 'Saved Vault'];

        function initCatalogControls() {
            // Populate Brands
            const brandSelect = document.getElementById('brandFilter');
            const brands = [...new Set(products.map(p => p.brand))];
            brands.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                brandSelect.appendChild(opt);
            });

            // Category Pills
            const pillsHost = document.getElementById('categoryPills');
            pillsHost.innerHTML = categories.map(cat => `
                <button class="filter-pill ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">
                    ${cat === 'Saved Vault' ? '<i class="fas fa-heart" style="margin-right:4px;"></i>' : ''}${cat}
                </button>
            `).join('');

            pillsHost.querySelectorAll('.filter-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeCategory = btn.dataset.cat;
                    showSavedOnly = activeCategory === 'Saved Vault';
                    pillsHost.querySelectorAll('.filter-pill').forEach(b => b.classList.toggle('active', b === btn));
                    renderCatalog();
                });
            });

            document.getElementById('catalogSearch').addEventListener('input', renderCatalog);
            document.getElementById('brandFilter').addEventListener('change', renderCatalog);
            document.getElementById('sortFilter').addEventListener('change', renderCatalog);

            window.addEventListener('aura:currencyChange', renderCatalog);
            window.addEventListener('aura:wishlistChange', () => {
                if (showSavedOnly) renderCatalog();
            });
        }

        function resetCatalogFilters() {
            document.getElementById('catalogSearch').value = '';
            document.getElementById('brandFilter').value = 'ALL';
            document.getElementById('sortFilter').value = 'featured';
            activeCategory = 'All';
            showSavedOnly = false;
            document.querySelectorAll('#categoryPills .filter-pill').forEach(b => b.classList.toggle('active', b.dataset.cat === 'All'));
            renderCatalog();
        }

        function renderCatalog() {
            const q = document.getElementById('catalogSearch').value.trim().toLowerCase();
            const brand = document.getElementById('brandFilter').value;
            const sort = document.getElementById('sortFilter').value;
            const wishlist = AuraApp.getWishlist();

            let filtered = products.filter(p => {
                if (showSavedOnly && !wishlist.includes(p.id)) return false;
                if (!showSavedOnly && activeCategory !== 'All' && p.category !== activeCategory) return false;
                if (brand !== 'ALL' && p.brand !== brand) return false;
                if (q) {
                    const hay = `${p.name} ${p.brand} ${p.category} ${p.ref} ${p.desc} ${p.specs.caseMaterial} ${p.specs.caliber}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            if (sort === 'price-asc') filtered.sort((a, b) => a.priceNum - b.priceNum);
            else if (sort === 'price-desc') filtered.sort((a, b) => b.priceNum - a.priceNum);
            else if (sort === 'name-asc') filtered.sort((a, b) => a.name.localeCompare(b.name));
            else filtered.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || a.id - b.id);

            const isFiltered = q !== '' || brand !== 'ALL' || activeCategory !== 'All';
            document.getElementById('resetFiltersBtn').style.display = isFiltered ? 'inline-flex' : 'none';
            document.getElementById('resultsCount').textContent = `Showing ${filtered.length} of ${products.length} timepieces`;

            const grid = document.getElementById('productGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="panel" style="grid-column:1/-1;text-align:center;padding:4rem 2rem;">
                        <i class="fas fa-compass" style="font-size:2.5rem;color:var(--primary);margin-bottom:1rem;"></i>
                        <h3 class="serif" style="font-size:1.6rem;margin-bottom:0.5rem;">No Matching Timepieces</h3>
                        <p style="color:var(--text-muted);margin-bottom:1.5rem;">Try adjusting your search keywords or clearing active filters.</p>
                        <button class="btn btn-fill btn-sm" onclick="resetCatalogFilters()">Show All Timepieces</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => AuraApp.renderWatchCard(p)).join('');
            AuraApp.observeReveals();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCatalogControls();
            renderCatalog();
        });
    </script>
</body>
</html>
