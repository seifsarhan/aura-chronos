<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Boutiques &amp; Appointments | AURA CHRONOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div id="siteNav"></div>

    <section class="page-top">
        <div class="section-header reveal">
            <span class="section-kicker">World of Aura</span>
            <h1 class="serif">Global Boutiques</h1>
            <p>Experience our timepieces in person across Cairo, Geneva, and London with private champagne salon consultations.</p>
        </div>

        <div class="grid-3" id="boutiquesGrid"></div>
    </section>

    <!-- PRIVATE APPOINTMENT BOOKING -->
    <section id="appointment" style="background: var(--bg-light); border-top: 1px solid var(--glass-border);">
        <div class="container" style="max-width:860px;padding:0;">
            <div class="section-header reveal" style="margin-bottom:2.5rem;">
                <span class="section-kicker">Bespoke Consultation</span>
                <h2 class="serif">Book a Private Viewing</h2>
                <p>Reserve a dedicated collector suite and let our specialists prepare your requested timepieces in advance.</p>
            </div>

            <div class="panel reveal">
                <form id="appointmentForm">
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>Select Salon</label>
                            <select id="apptBoutique">
                                <option value="Cairo Flagship Salon (Arkan Plaza)">Cairo Flagship Salon — Arkan Plaza</option>
                                <option value="Geneva Manufacture & Atelier">Geneva Manufacture — Rue du Rhône 42</option>
                                <option value="London Mayfair Lounge">London Mayfair Lounge — New Bond St</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Timepiece of Interest</label>
                            <select id="apptWatch"></select>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>Preferred Date</label>
                            <input type="date" id="apptDate" required>
                        </div>
                        <div class="form-group">
                            <label>Preferred Time Slot</label>
                            <select id="apptTime">
                                <option value="11:30 AM">11:30 AM — Morning Espresso Salon</option>
                                <option value="2:00 PM">2:00 PM — Afternoon Viewing</option>
                                <option value="5:00 PM">5:00 PM — Sunset Private Suite</option>
                                <option value="7:30 PM">7:30 PM — Evening VIP Consultation</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>Client Full Name</label>
                            <input type="text" id="apptName" placeholder="Your Full Name" required>
                        </div>
                        <div class="form-group">
                            <label>Phone or Email</label>
                            <input type="text" id="apptContact" placeholder="+20 100 000 0000" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-fill" style="width:100%;">Confirm Private Appointment</button>
                </form>

                <div id="apptConfirmation" style="display:none;margin-top:1.5rem;padding:1.25rem;border:1px solid var(--gold-border);background:var(--primary-soft);border-radius:8px;"></div>
            </div>
        </div>
    </section>

    <div id="siteFooter"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        function renderBoutiques() {
            const grid = document.getElementById('boutiquesGrid');
            grid.innerHTML = boutiquesData.map(b => `
                <div class="card reveal">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
                        <span style="font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--primary);font-weight:600;">${b.badge}</span>
                        <span class="boutique-status" style="margin:0;"><span class="availability-dot"></span> Open</span>
                    </div>
                    <h3 class="serif" style="font-size:1.6rem;margin-bottom:0.65rem;">${b.name}</h3>
                    <p style="color:var(--text-muted);font-size:0.92rem;margin-bottom:0.85rem;"><i class="fas fa-map-marker-alt" style="color:var(--primary);margin-right:0.45rem;"></i>${b.address}</p>
                    <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:0.5rem;"><i class="far fa-clock" style="color:var(--primary);margin-right:0.45rem;"></i>${b.hours}</p>
                    <p style="font-size:0.9rem;margin-bottom:0.5rem;"><i class="fas fa-phone" style="color:var(--primary);margin-right:0.45rem;"></i><a href="tel:${b.phone.replace(/\s+/g, '')}" style="text-decoration:none;">${b.phone}</a></p>
                    <div class="tag-list">
                        ${b.features.map(f => `<span class="tag-chip">${f}</span>`).join('')}
                    </div>
                    <div style="margin-top:auto;display:flex;gap:0.6rem;flex-wrap:wrap;">
                        <button class="btn btn-fill btn-sm" style="flex:1;" onclick="preselectBoutique('${b.name}')">Book Here</button>
                        <a href="${b.mapUrl}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm"><i class="fas fa-directions"></i> Map</a>
                    </div>
                </div>
            `).join('');
            AuraApp.observeReveals();
        }

        function preselectBoutique(name) {
            const sel = document.getElementById('apptBoutique');
            for (const opt of sel.options) {
                if (opt.value.includes(name.split(' ')[0])) {
                    sel.value = opt.value;
                    break;
                }
            }
            document.getElementById('appointment').scrollIntoView({ behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderBoutiques();

            // Populate Watch Select
            const watchSel = document.getElementById('apptWatch');
            watchSel.innerHTML = `<option value="General Private Collection Tour">General Private Collection Tour</option>` +
                products.map(p => `<option value="${p.name} (${p.brand})">${p.name} — ${p.brand}</option>`).join('');

            const preWatch = new URLSearchParams(window.location.search).get('watch');
            if (preWatch) {
                for (const opt of watchSel.options) {
                    if (opt.value.toLowerCase().includes(preWatch.toLowerCase())) {
                        watchSel.value = opt.value;
                        break;
                    }
                }
            }

            // Default minimum date = today
            const dateInput = document.getElementById('apptDate');
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
            const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
            dateInput.value = tomorrow;

            document.getElementById('appointmentForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const ref = `VIP-${Math.floor(1000 + Math.random() * 9000)}`;
                const appt = {
                    ref,
                    boutique: document.getElementById('apptBoutique').value,
                    watch: document.getElementById('apptWatch').value,
                    date: document.getElementById('apptDate').value,
                    time: document.getElementById('apptTime').value,
                    name: document.getElementById('apptName').value.trim(),
                    contact: document.getElementById('apptContact').value.trim()
                };
                AuraApp.saveAppointment(appt);

                const box = document.getElementById('apptConfirmation');
                box.style.display = 'block';
                box.innerHTML = `
                    <div style="display:flex;align-items:start;gap:0.85rem;">
                        <i class="fas fa-calendar-check" style="color:var(--primary);font-size:1.5rem;margin-top:0.2rem;"></i>
                        <div>
                            <h4 class="serif" style="font-size:1.25rem;margin-bottom:0.25rem;">Private Viewing Confirmed · ${appt.ref}</h4>
                            <p style="font-size:0.9rem;color:var(--text-muted);">
                                We look forward to welcoming <strong>${appt.name}</strong> at <strong>${appt.boutique}</strong> on <strong>${appt.date}</strong> at <strong>${appt.time}</strong> to present the <strong>${appt.watch}</strong>.
                            </p>
                        </div>
                    </div>
                `;
                e.target.reset();
                dateInput.value = tomorrow;
                AuraApp.showToast(`Appointment ${ref} confirmed!`);
            });
        });
    </script>
</body>
</html>
